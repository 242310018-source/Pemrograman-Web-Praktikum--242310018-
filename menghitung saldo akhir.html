<!DOCTYPE html>
<html>
<head>
    <title>Hitung Saldo Tabungan</title>
</head>
<body>

<h2>Perhitungan Saldo Tabungan</h2>

<form>
    Saldo Awal: <input type="number" id="saldo"><br><br>
    Bunga (%): <input type="number" id="bunga"><br><br>
    Waktu (bulan): <input type="number" id="waktu"><br><br>

    <button type="button" onclick="hitung()">Hitung</button>
    <button type="reset">Reset</button>
</form>

<h3>Hasil:</h3>
<p id="hasil"></p>

<script>
function hitung() {
    let saldo = parseFloat(document.getElementById("saldo").value);
    let bunga = parseFloat(document.getElementById("bunga").value);
    let waktu = parseInt(document.getElementById("waktu").value);

    let hasil = "";

    for (let i = 1; i <= waktu; i++) {
        saldo = saldo + (saldo * bunga / 100);
        hasil += "Saldo Bulan " + i + " = Rp. " + saldo.toFixed(0) + "<br>";
    }

    document.getElementById("hasil").innerHTML = hasil;
}
</script>

</body>
</html>
