<!DOCTYPE html>
<html>
<head>
    <title>Travel IBIK Abadi</title>
</head>
<body>

<h2>Travel IBIK Abadi</h2>

<form>
    Nama Pemesan: <input type="text" id="nama"><br><br>

    Tujuan:
    <select id="tujuan">
        <option value="jakarta">Jakarta</option>
        <option value="solo">Solo</option>
        <option value="surabaya">Surabaya</option>
        <option value="Bogor">Bogor</option>
        <option value="Malang">Malang</option>
    </select><br><br>

    Kelas:
    <select id="kelas">
        <option value="eksekutif">Eksekutif</option>
        <option value="bisnis">Bisnis</option>
        <option value="ekonomi">Ekonomi</option>
    </select><br><br>

    Banyak Tiket: <input type="number" id="tiket"><br><br>

    Status:
    <select id="status">
        <option value="member">Member</option>
        <option value="non">Bukan Member</option>
    </select><br><br>

    <button type="button" onclick="hitung()">KIRIM</button>
</form>

<h3>Output:</h3>
<p id="output"></p>

<script>
function hitung() {
    let tujuan = document.getElementById("tujuan").value;
    let kelas = document.getElementById("kelas").value;
    let tiket = parseInt(document.getElementById("tiket").value);
    let status = document.getElementById("status").value;

    let harga = 0;

    // Tentukan harga
    if (tujuan == "jakarta") {
        if (kelas == "eksekutif") harga = 70000;
        else if (kelas == "bisnis") harga = 40000;
        else harga = 10000;
    } 
    else if (tujuan == "solo") {
        if (kelas == "eksekutif") harga = 80000;
        else if (kelas == "bisnis") harga = 50000;
        else harga = 20000;
    } 
    else if (tujuan == "surabaya") {
        if (kelas == "eksekutif") harga = 90000;
        else if (kelas == "bisnis") harga = 60000;
        else harga = 30000;
    }
    else if (tujuan == "Bogor") {
        if (kelas == "eksekutif") harga = 10000;
        else if (kelas == "bisnis") harga = 70000;
        else harga = 60000;
    }
    else if (tujuan == "Malang") {
        if (kelas == "eksekutif") harga = 90000;
        else if (kelas == "bisnis") harga = 80000;
        else harga = 50000;
    }

    let subtotal = harga * tiket;
    let diskon = 0;

    if (status == "member") {
        diskon = subtotal * 0.1;
    }

    let total = subtotal - diskon;

    document.getElementById("output").innerHTML =
        "Harga Tiket: " + harga + "<br>" +
        "Subtotal: " + subtotal + "<br>" +
        "Diskon: " + diskon + "<br>" +
        "Total Bayar: " + total;
}
</script>

</body>
</html>
